    <!-- Monetag Popunder Direct Link (Browser-Friendly Solution) -->
    <script>
      (function() {
        function triggerAd(e) {
          if (!sessionStorage.getItem('monetagAdShown')) {
            var a = document.createElement('a');
            a.href = 'https://omg10.com/4/11933068';
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            sessionStorage.setItem('monetagAdShown', 'true');
            document.removeEventListener('click', triggerAd, true);
          }
        }

        document.addEventListener('click', triggerAd, true);
      })();
    </script>
